name: Build Android monitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-monitor/**"
      - ".github/workflows/android-monitor.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Keep a stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cloud-in-buzunar-monitor-debug-key-v1

      - name: Build debug APK
        working-directory: android-monitor
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-in-buzunar-monitor-debug
          path: android-monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-monitor/app/build/outputs/apk/debug/app-debug.apk \
            cloud-in-buzunar-monitor.apk

          if gh release view android-monitor-latest >/dev/null 2>&1; then
            gh release upload android-monitor-latest \
              cloud-in-buzunar-monitor.apk --clobber
          else
            gh release create android-monitor-latest \
              cloud-in-buzunar-monitor.apk \
              --target "$GITHUB_SHA" \
              --title "CloudInBuzunar Monitor Android" \
              --notes "Development APK for the native monitor companion." \
              --prerelease
          fi
