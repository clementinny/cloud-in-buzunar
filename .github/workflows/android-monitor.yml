name: Build Android monitor APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-monitor/**"
      - ".github/workflows/android-monitor.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android-monitor
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-in-buzunar-monitor-debug
          path: android-monitor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
