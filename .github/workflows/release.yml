name: Stable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android-release:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore the project signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cloud-in-buzunar-monitor-debug-key-v1

      - name: Test and build the Android companion
        working-directory: android-monitor
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare release assets
        shell: bash
        run: |
          cp android-monitor/app/build/outputs/apk/debug/app-debug.apk \
            cloud-in-buzunar-monitor-1.0.11.apk
          sha256sum cloud-in-buzunar-monitor-1.0.11.apk > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            cloud-in-buzunar-monitor-1.0.11.apk \
            SHA256SUMS.txt \
            --verify-tag \
            --title "CloudInBuzunar $GITHUB_REF_NAME" \
            --notes-file .github/release-notes/v1.0.11.md \
            --latest
